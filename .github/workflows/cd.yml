name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types:
      - completed

env:
  CLUSTER_NAME: salma-cluster
  NAMESPACE: salma-gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Update image tags
        run: |
          cd k8s
          sed -i "s|image: salma-gateway/backend:.*|image: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}|g" backend-deployment.yaml
          sed -i "s|image: salma-gateway/frontend:.*|image: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}|g" frontend-deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/postgres-statefulset.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/salma-backend -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/salma-frontend -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Run smoke tests
        run: |
          BACKEND_URL=$(kubectl get ingress salma-ingress -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.rules[0].host}')
          curl -f https://${BACKEND_URL}/api/health || exit 1

      - name: Notify on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Salma Gateway deployed successfully!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Successful* :rocket:\nCommit: `${{ github.sha }}`\nBranch: `${{ github.ref_name }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Salma Gateway deployment failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed* :x:\nCommit: `${{ github.sha }}`\nCheck the logs for details."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
