apiVersion: v1
kind: ConfigMap
metadata:
  name: salma-config
  namespace: salma-gateway
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://salma.example.com"
  MAX_UPLOAD_SIZE: "52428800"  # 50MB

  # Feature flags
  ENABLE_DOCUMENT_PROCESSING: "true"
  ENABLE_VECTOR_SEARCH: "true"
  ENABLE_AUDIT_LOGGING: "true"
