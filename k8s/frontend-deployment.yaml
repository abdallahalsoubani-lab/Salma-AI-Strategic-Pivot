apiVersion: apps/v1
kind: Deployment
metadata:
  name: salma-frontend
  namespace: salma-gateway
  labels:
    app: salma-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salma-frontend
  template:
    metadata:
      labels:
        app: salma-frontend
    spec:
      containers:
        - name: frontend
          image: salma-gateway/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: salma-frontend
  namespace: salma-gateway
spec:
  selector:
    app: salma-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
