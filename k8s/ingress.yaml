apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salma-ingress
  namespace: salma-gateway
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - salma.example.com
        - api.salma.example.com
      secretName: salma-tls-secret
  rules:
    - host: salma.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: salma-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: salma-backend
                port:
                  number: 8000
    - host: api.salma.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: salma-backend
                port:
                  number: 8000
