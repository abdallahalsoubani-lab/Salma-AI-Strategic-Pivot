apiVersion: v1
kind: Secret
metadata:
  name: salma-secrets
  namespace: salma-gateway
type: Opaque
stringData:
  # Database
  DB_USER: "salma_user"
  DB_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  DB_NAME: "salma_db"

  # Application
  SECRET_KEY: "CHANGE_ME_VERY_LONG_SECRET_KEY_FOR_JWT"

  # AI Providers
  ANTHROPIC_API_KEY: "sk-ant-xxxxx"
  OPENAI_API_KEY: "sk-xxxxx"
  COHERE_API_KEY: ""
  JAIS_API_KEY: ""
